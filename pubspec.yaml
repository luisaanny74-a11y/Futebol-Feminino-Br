name: futebol_feminino_br
description: Aplicativo Flutter (mobile e web) para gerenciar equipes, jogadoras e partidas de um campeonato, consumindo a API Flask do projeto.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
